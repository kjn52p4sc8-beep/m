[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Installed browsers supporting Web Share Target open the same local editor.
[[redirects]]
  from = "/share-target"
  to = "/index.html"
  status = 200
